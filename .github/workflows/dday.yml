name: update-dday
on:
  schedule:
    - cron: "2 * * * *"     # every hour (KST midnight is picked up within the hour)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [generate.py]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generate.py
      - name: commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name "dday-bot"
          git config user.email "dday-bot@users.noreply.github.com"
          git add *.svg
          git commit -m "D-day $(date -u +%F)"
          git push
